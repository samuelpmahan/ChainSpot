[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainspot-quick-anno"
version = "0.0.0"
description = "Experimental Python authoring surface for ChainSpot PCR composition"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chainspot_quick_anno*"]
