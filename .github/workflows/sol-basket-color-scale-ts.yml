name: Sol basket color scale TS check

on:
  push:
    branches:
      - sol/basket-color-scale-ts
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- tests/unit/basketColorScale.test.ts
      - run: npm run check
