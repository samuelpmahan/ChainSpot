name: Straight Test Course Proofs

on:
  push:
    branches:
      - spike/straight-ray-basket-106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  straight-test-courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout ChainSpot
        uses: actions/checkout@v4
        with:
          path: ChainSpot

      - name: Checkout pinned corpus
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          ref: 2b5913d3f1f6d8f97b0324721a4c5201bd3ed819
          path: chainspot-corpus
          lfs: true

      - name: Install evaluator-only annotations
        run: |
          cp ChainSpot/tests/fixtures/straight-ray/Lenard-full.annotation.json chainspot-corpus/dev/Annotated/Lenard/Lenard-full.annotation.json
          cp ChainSpot/tests/fixtures/straight-ray/DashsTrack-full.annotation.json chainspot-corpus/dev/Annotated/DashsTrack/DashsTrack-full.annotation.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Setup
        working-directory: ChainSpot
        run: |
          npm ci
          npx svelte-kit sync
          npm run build --workspace @chainspot/alg

      - name: Frozen default remains frozen
        working-directory: ChainSpot
        run: npx vitest run tests/unit/threeFactorConfig.test.ts --reporter=verbose

      - name: Lenard Straight Test proof
        working-directory: ChainSpot
        run: npx vitest run tests/unit/straightTestDirectedLenard.test.ts --reporter=verbose

      - name: Dashs Straight Test observational sweep
        working-directory: ChainSpot
        run: npx vitest run tests/unit/straightTestDirectedDashs.test.ts --reporter=verbose

      - name: Dashs lane tracker A/B
        working-directory: ChainSpot
        run: npx vitest run tests/unit/laneTrackerDashsProbe.test.ts --reporter=verbose

      - name: Upload pathfinding VisualRenders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: straight-test-course-visuals
          path: |
            ChainSpot/artifacts/sweep/straight-test-lenard
            ChainSpot/artifacts/sweep/straight-test-dashs
            ChainSpot/artifacts/sweep/lane-tracker-dashs
          if-no-files-found: error
