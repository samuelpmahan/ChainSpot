name: Straight Test Lenard Proof

on:
  push:
    branches:
      - spike/straight-ray-basket-106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lenard-straight-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout ChainSpot
        uses: actions/checkout@v4
        with:
          path: ChainSpot

      - name: Checkout pinned corpus
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          ref: 2b5913d3f1f6d8f97b0324721a4c5201bd3ed819
          path: chainspot-corpus
          lfs: true

      - name: Install evaluator-only Lenard annotation
        run: cp ChainSpot/tests/fixtures/straight-ray/Lenard-full.annotation.json chainspot-corpus/dev/Annotated/Lenard/Lenard-full.annotation.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Setup
        working-directory: ChainSpot
        run: |
          npm ci
          npx svelte-kit sync
          npm run build --workspace @chainspot/alg

      - name: Frozen default remains frozen
        working-directory: ChainSpot
        run: npx vitest run tests/unit/threeFactorConfig.test.ts --reporter=verbose

      - name: Straight Test production + renderer proof
        working-directory: ChainSpot
        run: npx vitest run tests/unit/straightTestDirectedLenard.test.ts --reporter=verbose

      - name: Upload Straight Test VisualRender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenard-straight-test-visual
          path: ChainSpot/artifacts/sweep/straight-test-lenard
          if-no-files-found: error
