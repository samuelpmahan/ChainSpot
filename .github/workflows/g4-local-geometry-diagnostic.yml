name: G4 Local Geometry Diagnostic

on:
  push:
    branches: [experiment/g4-shard-ray-only]
    paths: [.github/workflows/g4-local-geometry-diagnostic.yml]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ChainSpot
      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run only through G4
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          npm ci >/dev/null
          ./lab setup >/tmp/setup.log 2>&1
          rm -rf artifacts/sweep
          ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json dev >/tmp/g4.log 2>&1
          echo '=== G4 ONLY SUMMARY ==='
          cat artifacts/sweep/dev72-recovered-default/batches/summary.txt
          echo '=== G4 LOCAL TESTIMONY ==='
          for f in $(find artifacts/sweep -name run.receipt.json | sort); do
            echo "--- $f"
            node - "$f" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const u=(d.units||[]).find(x=>x.id==='teeRecovery')||{};
          const ms=Object.fromEntries((u.measurements||[]).filter(m=>[
            'visibleRayClaims','visibleRayLocks','visibleRayCoveredBadges','visibleRayAmbiguousTees',
            'visibleRayConflictedBadges','missingNumberedTees','accepted','badgePerpendicularErrorPx',
            'badgePerpendicularBoundPx','badgePerpendicularMissPx'
          ].includes(m.name)).map(m=>[m.name,m.mean]));
          const shards=(u.drawables||[])
            .filter(x=>x.visualRole==='tee-shard')
            .map(x=>({verdict:x.verdict,ref:x.ref,reason:x.reason,values:x.values}))
            .filter(x=>x.verdict==='accepted' || /rail projection|multiclaim|badge [0-9]+:/i.test(x.reason||''));
          console.log(JSON.stringify({results:d.results,measurements:ms,shards},null,2));
          NODE
          done
          echo '=== G4 LOG TAIL ==='
          tail -n 80 /tmp/g4.log
