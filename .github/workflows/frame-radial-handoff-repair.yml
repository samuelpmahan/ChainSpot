name: frame-radial-handoff-repair

on:
  push:
    branches: [scratch/frame-radial-handoff-repair]

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply validated repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f"{path}: expected one match, found {n}: {old[:90]!r}")
              p.write_text(s.replace(old,new,1))
          one('packages/alg/src/detectors/threeFactor/componentAssembly.ts','conts.set(key, { margins, count: (prior?.count ?? 0) + 1 });','counts.set(key, { margins, count: (prior?.count ?? 0) + 1 });')
          one('packages/alg/src/detectors/threeFactor/objects.ts','baskets: measurent.baskets.map((evidence) => {','baskets: measurement.baskets.map((evidence) => {')
          ops=Path('packages/alg/src/exec/operations.ts'); s=ops.read_text()
          reps=[
            ("interface BadgeStageComponents {\n\treadonly brightLabels: Int32Array;\n\treadonly brightComponents: ComponentStats[];\n}","interface BadgeStageComponents {\n\treadonly brightLabels: Int32Array;\n\treadonly brightComponents: ComponentStats[];\n\treadonly darkLabels: Int32Array;\n\treadonly darkComponents: ComponentStats[];\n}"),
            ("\t\t\tconst { bright } = board.get<BadgeStageMasks>('badgeStage.masks');\n\t\t\tconst { labels, components } = extractComponents(bright);\n\t\t\tboard.set('badgeStage.components', {\n\t\t\t\tbrightLabels: labels,\n\t\t\t\tbrightComponents: components\n\t\t\t} satisfies BadgeStageComponents);","\t\t\tconst { bright, dark } = board.get<BadgeStageMasks>('badgeStage.masks');\n\t\t\tconst { labels: brightLabels, components: brightComponents } = extractComponents(bright);\n\t\t\tconst { labels: darkLabels, components: darkComponents } = extractComponents(dark);\n\t\t\tboard.set('badgeStage.components', {\n\t\t\t\tbrightLabels,\n\t\t\t\tbrightComponents,\n\t\t\t\tdarkLabels,\n\t\t\t\tdarkComponents\n\t\t\t} satisfies BadgeStageComponents);"),
            ("\t\t\tconst { brightLabels, brightComponents } =\n\t\t\t\tboard.get<BadgeStageComponents>('badgeStage.components');","\t\t\tconst { brightLabels, brightComponents, darkLabels, darkComponents } =\n\t\t\t\tboard.get<BadgeStageComponents>('badgeStage.components');"),
            ("\t\t\trecoverDarkPlateBadges(image.width, bright, dark, badges, badgeSources, plateBboxes, knobs);","\t\t\trecoverDarkPlateBadges(\n\t\t\t\timage.width,\n\t\t\t\tbright,\n\t\t\t\tdark,\n\t\t\t\tbadges,\n\t\t\t\tbadgeSources,\n\t\t\t\tplateBboxes,\n\t\t\t\tknobs,\n\t\t\t\tdarkComponents\n\t\t\t);"),
            ("\t\t\t\tbrightLabels,\n\t\t\t\tbrightComponents,\n\t\t\t\tbadges,","\t\t\t\tbrightLabels,\n\t\t\t\tbrightComponents,\n\t\t\t\tdarkLabels,\n\t\t\t\tdarkComponents,\n\t\t\t\tbadges,")]
          for old,new in reps:
              n=s.count(old)
              if n != 1: raise SystemExit(f"operations.ts: expected one match, found {n}: {old[:100]!r}")
              s=s.replace(old,new,1)
          ops.write_text(s)
          PY
      - run: npm ci
      - name: Compile algorithm package
        run: npm run --workspace @chainspot/alg build
      - name: Ownership smoke
        run: npx vitest run tests/unit/componentOwnership.test.ts
      - name: Remove temporary workflow and commit validated tree
        shell: bash
        run: |
          git rm .github/workflows/frame-radial-handoff-repair.yml
          git config user.name "ChainSpot handoff repair"
          git config user.email "actions@users.noreply.github.com"
          git add packages/alg/src/detectors/threeFactor/componentAssembly.ts packages/alg/src/detectors/threeFactor/objects.ts packages/alg/src/exec/operations.ts
          git commit -m "Repair and validate object-perimeter experiment base"
          git push origin HEAD:scratch/frame-radial-handoff-repair
