name: CV guardrail verification

on:
  push:
    branches:
      - agent/phase3-cv-integration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check
      - run: npm run build
      - run: npm run detect:tees -- resources/GoldenTeeSet.chainspot.zip --mode fused --ui-scale 1.7746 --out /tmp/chainspot-tee-guardrail
      - run: npm run detect:baskets -- resources/GoldenBasketSet.chainspot.zip --out /tmp/chainspot-basket-guardrail
      - run: npm run verify:cv
      - run: git diff --check
