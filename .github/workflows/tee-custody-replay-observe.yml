name: Tee Custody Replay Observe

on:
  push:
    branches:
      - research/tee-custody-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ChainSpot
      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup
        working-directory: ChainSpot
        run: |
          npm ci
          ./lab setup
      - name: Observe Dashs recovery replay through custody
        working-directory: ChainSpot/scripts/chainspot-lab
        run: |
          set -euo pipefail
          IMG="$(find ../../../chainspot-corpus -type f \( -iname '*DashsTrack*.jpg' -o -iname '*dashs*track*.jpg' -o -iname '*dashs*.jpg' \) | grep -v '/Annotated/' | sort | head -n 1)"
          if [ -z "$IMG" ]; then
            echo 'DashsTrack JPG not found' >&2
            find ../../../chainspot-corpus -maxdepth 5 -type f | sort | grep -i dash | head -n 100 || true
            exit 2
          fi
          IMG="$(realpath "$IMG")"
          echo "OBS_IMAGE=$IMG"
          OBS_IMAGE="$IMG" node --import tsx --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { canonicalizeInputs } from './sweep/inputShim.ts';
          import {
            runThreeFactor,
            resolveConfig,
            DEFAULT_EXECUTION
          } from '@chainspot/alg/detectors/threeFactor';

          const defaultJson = JSON.parse(
            readFileSync('../../packages/alg/src/detectors/threeFactor/configs/default.json', 'utf8')
          );
          const { report, image } = await canonicalizeInputs([process.env.OBS_IMAGE]);
          const raster = {
            imageId: report.imageId,
            widthPx: image.width,
            heightPx: image.height,
            rgba: new Uint8ClampedArray(image.data)
          };

          const fullConfig = resolveConfig(defaultJson, DEFAULT_EXECUTION);
          const preJson = {
            ...defaultJson,
            name: 'observe-before-teeRecovery',
            execution: defaultJson.execution.filter(id => id !== 'teeRecovery')
          };
          const preConfig = resolveConfig(preJson, DEFAULT_EXECUTION);

          const pre = runThreeFactor(raster, { config: preConfig, paramsHash: 'observe-pre' });
          const full = runThreeFactor(raster, { config: fullConfig, paramsHash: 'observe-full' });

          const assignmentMap = run => new Map(run.assignment.assignments.map(a => [a.badgeId, a]));
          const preMap = assignmentMap(pre);
          const fullMap = assignmentMap(full);
          const badgeLabel = (run, badgeId) => run.measurement.badges.find(b => b.detId === badgeId)?.label ?? 'UNREAD';
          const changes = [];
          for (const [badgeId, row] of fullMap) {
            const before = preMap.get(badgeId);
            if (!before || before.teeId !== row.teeId || before.basketId !== row.basketId) {
              changes.push({
                hole: badgeLabel(full, badgeId),
                badgeId,
                before: before ? `${before.teeId}->${before.basketId}` : 'UNASSIGNED',
                after: `${row.teeId}->${row.basketId}`,
                scoreBefore: before?.score ?? null,
                scoreAfter: row.score
              });
            }
          }

          const recovered = full.custody.tees.filter(t => t.originKind === 'recovered');
          console.log('=== CANONICAL ===');
          console.log(JSON.stringify({ imageId: report.imageId, width: image.width, height: image.height, stripChrome: report.stripChrome }, null, 2));
          console.log('=== COUNTS ===');
          console.log(JSON.stringify({
            before: { tees: pre.assignment.tees.length, assignments: pre.assignment.assignments.length },
            after: { tees: full.assignment.tees.length, assignments: full.assignment.assignments.length, custody: full.custody.tees.length },
            recovered: recovered.length
          }, null, 2));
          console.log('=== TRACE UNIT ORDER ===');
          console.log(full.trace.units.map(u => `${u.gate}:${u.id}`).join(' -> '));
          console.log('=== ASSIGNMENT CHANGES CAUSED BY RECOVERY ===');
          console.log(JSON.stringify(changes, null, 2));
          console.log('=== RECOVERED TEE CUSTODY ===');
          for (const record of recovered) {
            console.log(JSON.stringify({
              teeId: record.teeId,
              summary: record.summary,
              evidenceRefs: record.evidenceRefs,
              gaps: record.gaps,
              events: record.events.map(e => e.kind === 'trace'
                ? { kind: e.kind, sequence: e.sequence, gate: e.gate, unitId: e.unitId, verdict: e.verdict, ref: e.ref, visualRole: e.visualRole, reason: e.reason }
                : e)
            }, null, 2));
          }
          console.log('=== REPLAY VISIBILITY CHECK ===');
          const recoveredIds = new Set(recovered.map(r => r.teeId));
          const g5Refs = full.trace.units
            .filter(u => u.gate === 'G5')
            .flatMap(u => u.drawables.map(d => ({ unit: u.id, ref: d.ref })))
            .filter(x => x.ref && [...recoveredIds].some(id => x.ref === id || x.ref.startsWith(id + ':')));
          console.log(JSON.stringify({ recoveredIds: [...recoveredIds], g5TraceRefsToRecoveredTees: g5Refs }, null, 2));
          NODE
