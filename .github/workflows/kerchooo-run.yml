name: KERCHOOOOO benchmark

on:
  push:
    branches:
      - perf/kerchooo

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/kerchooo
          path: ChainSpot
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Install
        working-directory: ChainSpot
        run: |
          npm ci
          ./lab setup

      - name: Baseline NorthPark
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          /usr/bin/time -f '%e' -o /tmp/baseline.wall ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json NorthPark
          visual=$(find artifacts/sweep -path '*/NorthPark/full/renders/run/run.visual.png' -print -quit)
          receipt=$(find artifacts/sweep -path '*/NorthPark/full/run.receipt.txt' -print -quit)
          test -n "$visual" && test -n "$receipt"
          sha256sum "$visual" | awk '{print $1}' > /tmp/baseline.visual.sha
          cp "$receipt" /tmp/baseline.receipt.txt
          echo "BASELINE_WALL=$(cat /tmp/baseline.wall)s"
          echo "BASELINE_VISUAL=$(cat /tmp/baseline.visual.sha)"

      - name: Apply hot-loop patch
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          python3 .github/kerchooo_patch.py
          npx prettier --write packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts packages/alg/src/detectors/threeFactor/ribbon.ts
          git diff --check
          git diff --stat

      - name: Static and recovery tests
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          npm run check
          npx vitest run tests/unit/teeRecoveryFeature.test.ts

      - name: Optimized NorthPark exact visual parity
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          /usr/bin/time -f '%e' -o /tmp/optimized.wall ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json NorthPark
          visual=$(find artifacts/sweep -path '*/NorthPark/full/renders/run/run.visual.png' -print -quit)
          receipt=$(find artifacts/sweep -path '*/NorthPark/full/run.receipt.txt' -print -quit)
          test -n "$visual" && test -n "$receipt"
          sha256sum "$visual" | awk '{print $1}' > /tmp/optimized.visual.sha
          cp "$receipt" /tmp/optimized.receipt.txt
          diff -u /tmp/baseline.visual.sha /tmp/optimized.visual.sha
          python3 - <<'PY'
          base=float(open('/tmp/baseline.wall').read())
          opt=float(open('/tmp/optimized.wall').read())
          print(f'KERCHOOOOO: {base:.2f}s -> {opt:.2f}s = {base/opt:.2f}x, {(1-opt/base)*100:.1f}% faster')
          PY
          echo '=== OPTIMIZED NORTHPARK RECEIPT ==='
          cat "$receipt"

      - name: Dev6 regression sweep
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json dev
          find artifacts/sweep -path '*/batches/summary.txt' -exec cat {} \;

      - name: Preserve perf receipt artifact
        working-directory: ChainSpot
        if: always()
        run: |
          mkdir -p artifacts/kerchooo
          cp /tmp/baseline.wall artifacts/kerchooo/ 2>/dev/null || true
          cp /tmp/optimized.wall artifacts/kerchooo/ 2>/dev/null || true
          cp /tmp/baseline.visual.sha artifacts/kerchooo/ 2>/dev/null || true
          cp /tmp/optimized.visual.sha artifacts/kerchooo/ 2>/dev/null || true
          cp /tmp/baseline.receipt.txt artifacts/kerchooo/ 2>/dev/null || true
          cp /tmp/optimized.receipt.txt artifacts/kerchooo/ 2>/dev/null || true

      - name: Commit proven source-only speedup
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          git config user.name 'ChainSpot KERCHOOOOO'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts packages/alg/src/detectors/threeFactor/ribbon.ts
          git rm .github/kerchooo_patch.py .github/workflows/kerchooo-run.yml
          git commit -m 'KERCHOOOOO: remove recovery and support-field hot-loop waste'
          git push origin HEAD:perf/kerchooo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerchooo-perf-receipts
          path: ChainSpot/artifacts/kerchooo
          if-no-files-found: warn
          retention-days: 2
