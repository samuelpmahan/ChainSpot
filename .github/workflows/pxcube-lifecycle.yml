name: PxCube lifecycle

on:
  push:
    branches:
      - 'pxcube/**'
  pull_request:
    paths:
      - 'scripts/pxcube-graph.mjs'
      - 'tests/node/pxcube-graph.test.mjs'
      - '.github/workflows/pxcube-lifecycle.yml'

permissions:
  contents: read

jobs:
  graph-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Part-derived toposort and invalidation closure
        run: |
          npm install --ignore-scripts
          npm run build --workspace @chainspot/alg
          node scripts/run-production-speculative-battery.mjs
          node scripts/prove-gateway-calculator.mjs
          node scripts/prove-calculator-dag.mjs
          node scripts/prove-calculator-catalog.mjs
          node --test tests/node/pxcube-graph.test.mjs tests/node/pxcube-s0-fork.test.mjs tests/node/pxcube-s0-receipt.test.mjs tests/node/pxcube-visual-comparison.test.mjs tests/node/pxcube-speculative-execution.test.mjs tests/node/pxcube-cache-key.test.mjs tests/node/pxcube-parity-propagation.test.mjs tests/node/pxcube-semantic-delta.test.mjs tests/node/pxcube-surgical-cone.test.mjs tests/node/pxcube-flexible-battery.test.mjs tests/node/pxcube-readiness-battery.test.mjs tests/node/pxcube-s1-real-cone.test.mjs tests/node/pxcube-resolution-testimony.test.mjs tests/node/pxcube-simple-calculator.test.mjs tests/node/pxcube-simple-calculator-pxc.test.mjs tests/node/pxcube-timing-comparison.test.mjs tests/node/pxcube-wave-scheduler.test.mjs tests/node/pxcube-part-editions.test.mjs tests/node/pxcube-lineage-board.test.mjs tests/node/pxcube-s0-catalog-fork.test.mjs tests/node/pxcube-s0-s1-semantic-bridge.test.mjs tests/node/pxcube-badge-parity.test.mjs tests/node/pxcube-cross-stage-receipt.test.mjs
      - name: Build fixed Gitless development workspace
        run: |
          bash scripts/package-gitless-workspace.sh artifacts/chainspot-workspace
          test -f artifacts/chainspot-workspace/WORKSPACE.json
          test -f artifacts/chainspot-workspace/package.json
          test -d artifacts/chainspot-workspace/packages/alg/src
          test -d artifacts/chainspot-workspace/node_modules
          # Prove the uploaded workspace is immediately runnable: no dependency install.
          (cd artifacts/chainspot-workspace && npm run build --workspace @chainspot/alg)
      - name: Prove staged Gitless artifact is clean
        run: |
          staged=artifacts/chainspot-workspace
          forbidden='\.git|dist|\.svelte-kit|coverage'
          if find "$staged" -type d \
            \( -name .git -o -name dist -o -name .svelte-kit -o -name coverage \) \
            -print -quit | grep -q .; then
            echo "staged Gitless artifact leaked an excluded directory" >&2
            find "$staged" -type d \
              \( -name .git -o -name dist -o -name .svelte-kit -o -name coverage \) \
              -print >&2
            exit 1
          fi
          tar -C artifacts -cf artifacts/chainspot-workspace-staged.tar chainspot-workspace
          if tar -tf artifacts/chainspot-workspace-staged.tar | grep -E "(^|/)($forbidden)(/|$)"; then
            echo "staged Gitless artifact archive contains an excluded directory" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chainspot-workspace
          path: artifacts/chainspot-workspace
          retention-days: 1
      - name: Materialize readiness receipt
        run: |
          mkdir -p artifacts/pxcube-readiness
          {
            echo "PXCUBE READINESS — DURABLE CHECKPOINT"
            echo "sha: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "graph-kernel: PASS"
            echo "real-s0-fork: PASS"
            echo "comparison-receipt: PASS"
            echo "next: visual comparison receipt"
          } | tee artifacts/pxcube-readiness/receipt.txt
          sha256sum scripts/pxcube-graph.mjs scripts/pxcube-s0-fork.mjs scripts/pxcube-s0-receipt.mjs > artifacts/pxcube-readiness/kernel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pxcube-readiness
          path: artifacts/pxcube-readiness
          retention-days: 1
