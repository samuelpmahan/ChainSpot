name: CHSPT-48 one-shot regression tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chspt48-hotfix-once.yml

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Update GuidedReview regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('tests/unit/annotateCourseKeyboardReview.test.ts')
          text = path.read_text()
          start = text.index("describe('Tab-driven review order', () => {")
          end = text.index("\ndescribe('X — reject", start) + 1
          encoded = ""
          replacement = base64.b64decode(encoded).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
          git diff -- tests/unit/annotateCourseKeyboardReview.test.ts
      - name: Install dependencies
        run: npm ci
      - name: Run targeted regression suite
        run: npm run test:unit -- tests/unit/annotateCourseKeyboardReview.test.ts
      - name: Run Svelte/type checks
        run: npm run check
      - name: Commit tests to main
        shell: bash
        run: |
          git config user.name "ChainSpot Tests"
          git config user.email "actions@users.noreply.github.com"
          git add tests/unit/annotateCourseKeyboardReview.test.ts
          git commit -m "CHSPT-48 regression: pin GuidedReview interaction contract"
          git push origin HEAD:main
