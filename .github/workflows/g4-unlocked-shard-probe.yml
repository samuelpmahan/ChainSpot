name: G4 Unlocked Claim Graph Probe

on:
  push:
    branches: [experiment/g4-shard-ray-only]
    paths: [.github/workflows/g4-unlocked-shard-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ChainSpot
      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search unlocked badges and dump claim graph
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts')
          s=p.read_text()
          old="""\t\tconst coveredBadgeIds = new Set(rayResolution.coveredBadgeIds);
          \t\tconst lockedKeys = new Set(rayResolution.locks.map((claim) => `${claim.teeId}|${claim.badgeId}`));
          """
          new="""\t\tconst coveredBadgeIds = new Set(rayResolution.coveredBadgeIds);
          \t\tconst lockedBadgeIds = new Set(rayResolution.locks.map((claim) => claim.badgeId));
          \t\tconst lockedKeys = new Set(rayResolution.locks.map((claim) => `${claim.teeId}|${claim.badgeId}`));
          """
          if s.count(old)!=1: raise SystemExit('lock setup drifted')
          s=s.replace(old,new,1)
          s=s.replace("if (coveredBadgeIds.size === numberedBadges.length) {", "if (lockedBadgeIds.size === numberedBadges.length) {", 1)
          old="""\t\tconst localRayClaims: TeeRecoveryAssignmentContext = {
          \t\t\tassignments: [...coveredBadgeIds].sort().map((badgeId) => ({ badgeId, basketId: 'G4-visible-ray-coverage' }))
          \t\t};
          """
          new="""\t\tconst localRayClaims: TeeRecoveryAssignmentContext = {
          \t\t\tassignments: [...lockedBadgeIds].sort().map((badgeId) => ({ badgeId, basketId: 'G4-visible-ray-lock' }))
          \t\t};
          """
          if s.count(old)!=1: raise SystemExit('search target adapter drifted')
          s=s.replace(old,new,1)
          anchor="""\t\tconst allResults = built.candidates.map(graphCandidateResult);
          \t\tgeometryFittingStop();
          """
          inject="""\t\tconst allResults = built.candidates.map(graphCandidateResult);
          \t\tconsole.log('G4_CLAIM_GRAPH ' + JSON.stringify({
          \t\t\tvisible: rayResolution.claims.map((claim) => ({ tee: claim.teeId, badge: claim.badgeLabel ?? claim.badgeId, badgeId: claim.badgeId, error: claim.perpendicularErrorPx, bound: claim.perpendicularBoundPx, direction: claim.direction, lock: rayResolution.locks.some((locked) => locked.teeId === claim.teeId && locked.badgeId === claim.badgeId) })),
          \t\t\tshards: built.candidates.map((candidate, index) => ({ badge: candidate.badgeLabel ?? candidate.badgeId ?? 'UNKNOWN', badgeId: candidate.badgeId, physical: candidate.supportingComponentIds.map((id) => id.split(':')[0]).sort().join('+'), verdict: allResults[index]?.verdict, fitKind: candidate.fit.fitKind, error: candidate.fit.badgePerpendicularErrorPx, bound: candidate.fit.badgePerpendicularBoundPx, miss: candidate.fit.badgePerpendicularMissPx, sepError: candidate.fit.railSeparationErrorPx, sepBound: candidate.fit.railSeparationBoundPx, support: candidate.fragmentPixels.length, ambiguity: candidate.ambiguityWithBadgeLabels ?? [] }))
          \t\t}));
          \t\tgeometryFittingStop();
          """
          if s.count(anchor)!=1: raise SystemExit('graph dump anchor drifted')
          p.write_text(s.replace(anchor,inject,1))
          PY
          npm ci >/dev/null
          ./lab setup >/tmp/setup.log 2>&1
          rm -rf artifacts/sweep
          ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json dev >/tmp/probe.log 2>&1
          echo '=== CLAIM GRAPHS ==='
          grep '^G4_CLAIM_GRAPH ' /tmp/probe.log || true
          echo '=== BATCH TAIL ==='
          tail -n 60 /tmp/probe.log
