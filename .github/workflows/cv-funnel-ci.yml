name: CV funnel CI

on:
  pull_request:
    branches:
      - staging/demo
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Package audit checkout
        if: always()
        run: tar --exclude=.git -czf /tmp/chainspot-audit-checkout.tgz .
      - name: Upload audit checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainspot-audit-checkout
          path: /tmp/chainspot-audit-checkout.tgz
          retention-days: 1
