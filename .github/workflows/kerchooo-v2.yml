name: KERCHOOOOO v2 benchmark

on:
  push:
    branches:
      - perf/kerchooo-v2

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/kerchooo-v2
          path: ChainSpot
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Install
        working-directory: ChainSpot
        run: |
          npm ci
          ./lab setup

      - name: Baseline NorthPark
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          /usr/bin/time -f '%e' -o /tmp/baseline.wall ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json NorthPark
          root=artifacts/sweep/dev72-recovered-default/batches/NorthPark/full
          sha256sum "$root/renders/run/run.visual.png" | awk '{print $1}' > /tmp/baseline.visual.sha
          sha256sum "$root/artifacts/scalarField/supportField.support.bin" | awk '{print $1}' > /tmp/baseline.support.sha
          sha256sum "$root/artifacts/orientationField/supportField.bestTheta.bin" | awk '{print $1}' > /tmp/baseline.theta.sha
          sha256sum "$root/artifacts/measurementTable/assignment.selection.table.bin" | awk '{print $1}' > /tmp/baseline.assignment.sha
          cp "$root/run.receipt.txt" /tmp/baseline.receipt.txt
          echo "BASELINE_WALL=$(cat /tmp/baseline.wall)s"
          grep -E 'supportField \||teeRecovery \||teeRecovery.shardDiscovery' /tmp/baseline.receipt.txt || true

      - name: Apply v2 source patch
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          python3 .github/kerchooo_v2_patch.py
          git diff --check
          git diff --stat

      - name: Static and recovery tests
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          npm run check
          npx vitest run tests/unit/teeRecoveryFeature.test.ts

      - name: Optimized NorthPark exact evidence parity
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          /usr/bin/time -f '%e' -o /tmp/optimized.wall ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json NorthPark
          root=artifacts/sweep/dev72-recovered-default/batches/NorthPark/full
          sha256sum "$root/renders/run/run.visual.png" | awk '{print $1}' > /tmp/optimized.visual.sha
          sha256sum "$root/artifacts/scalarField/supportField.support.bin" | awk '{print $1}' > /tmp/optimized.support.sha
          sha256sum "$root/artifacts/orientationField/supportField.bestTheta.bin" | awk '{print $1}' > /tmp/optimized.theta.sha
          sha256sum "$root/artifacts/measurementTable/assignment.selection.table.bin" | awk '{print $1}' > /tmp/optimized.assignment.sha
          cp "$root/run.receipt.txt" /tmp/optimized.receipt.txt
          diff -u /tmp/baseline.visual.sha /tmp/optimized.visual.sha
          diff -u /tmp/baseline.support.sha /tmp/optimized.support.sha
          diff -u /tmp/baseline.theta.sha /tmp/optimized.theta.sha
          diff -u /tmp/baseline.assignment.sha /tmp/optimized.assignment.sha
          python3 - <<'PY'
          base=float(open('/tmp/baseline.wall').read())
          opt=float(open('/tmp/optimized.wall').read())
          print(f'KERCHOOOOO V2: {base:.2f}s -> {opt:.2f}s = {base/opt:.2f}x, {(1-opt/base)*100:.1f}% faster')
          PY
          grep -E 'supportField \||teeRecovery \||teeRecovery.shardDiscovery' /tmp/optimized.receipt.txt || true

      - name: Dev6 regression sweep
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          rm -rf artifacts/sweep
          ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json dev
          find artifacts/sweep -path '*/batches/summary.txt' -exec cat {} \;

      - name: Preserve benchmark receipts
        working-directory: ChainSpot
        if: always()
        run: |
          mkdir -p artifacts/kerchooo-v2
          cp /tmp/baseline.* artifacts/kerchooo-v2/ 2>/dev/null || true
          cp /tmp/optimized.* artifacts/kerchooo-v2/ 2>/dev/null || true

      - name: Commit proven source-only speedup
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          git config user.name 'ChainSpot KERCHOOOOO'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts packages/alg/src/detectors/threeFactor/ribbon.ts
          git rm .github/kerchooo_v2_patch.py .github/workflows/kerchooo-v2.yml
          git commit -m 'KERCHOOOOO v2: reuse recovery poses and support sampling geometry'
          git push origin HEAD:perf/kerchooo-v2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerchooo-v2-receipts
          path: ChainSpot/artifacts/kerchooo-v2
          if-no-files-found: warn
          retention-days: 2
