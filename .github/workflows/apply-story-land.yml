name: Apply Story landing

on:
  push:
    branches:
      - lab/stages
    paths:
      - .lab-integration/story-land.patch.gz.b64
      - .github/workflows/apply-story-land.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact locally-tested landing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .lab-integration/story-land.patch.gz.b64 | gunzip > "$RUNNER_TEMP/story-land.patch"
          git apply --index "$RUNNER_TEMP/story-land.patch"
          git rm .lab-integration/story-land.patch.gz.b64 .github/workflows/apply-story-land.yml
          git config user.name "ChainSpot LAB Agent"
          git config user.email "lab-agent@chainspot.local"
          git commit -m "Land Stage Story surface and freeze S1"
          git push origin HEAD:lab/stages
