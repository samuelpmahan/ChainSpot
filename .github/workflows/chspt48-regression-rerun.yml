name: CHSPT-48 regression rerun

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chspt48-regression-rerun.yml

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Materialize GuidedReview regression patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          carrier = Path('.github/workflows/chspt48-hotfix-once.yml').read_text()
          match = re.search(r'^\s*encoded = "([A-Za-z0-9+/=]+)"$', carrier, re.MULTILINE)
          if not match:
              raise SystemExit('encoded regression block not found')

          path = Path('tests/unit/annotateCourseKeyboardReview.test.ts')
          text = path.read_text()
          start = text.index("describe('Tab-driven review order', () => {")
          end = text.index("\ndescribe('X — reject", start) + 1
          replacement = base64.b64decode(match.group(1)).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
      - run: npm ci
      - name: Run targeted regression suite
        run: npm run test:unit -- tests/unit/annotateCourseKeyboardReview.test.ts
      - name: Run Svelte/type checks
        run: npm run check
      - name: Commit regression coverage
        shell: bash
        run: |
          git config user.name "ChainSpot Tests"
          git config user.email "actions@users.noreply.github.com"
          git add tests/unit/annotateCourseKeyboardReview.test.ts
          git commit -m "CHSPT-48 regression: pin GuidedReview interaction contract"
          git push origin HEAD:main
