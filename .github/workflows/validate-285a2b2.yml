name: validate-285a2b2

on:
  push:
    branches:
      - validation/run-285a2b2

jobs:
  inspect-hot-loops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact ChainSpot commit
        uses: actions/checkout@v4
        with:
          ref: 285a2b2baaa7dc11fd5dee08074206b72f415822
          path: ChainSpot
          fetch-depth: 1

      - name: Locate and print hot-loop source
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          echo '=== SUPPORT FIELD MATCHES ==='
          grep -R -n -E 'supportField|bestTheta|scalarField' packages/alg/src/detectors/threeFactor packages/alg/src/detectors/labEndpoint scripts/chainspot-lab 2>/dev/null | head -200 || true
          echo '=== TEE RECOVERY MATCHES ==='
          grep -R -n -E 'shardDiscovery|global bright mask|no spatial prefilter|axisToleranceDeg|bfsComponentsVisited|runnerUpsBeyondReceiptCap' packages/alg/src/detectors/threeFactor packages/alg/src/detectors/labEndpoint 2>/dev/null | head -300 || true
          echo '=== HOT SOURCE FILES ==='
          files=$(grep -R -l -E 'supportField|shardDiscovery|global bright mask|no spatial prefilter|bfsComponentsVisited' packages/alg/src/detectors/threeFactor packages/alg/src/detectors/labEndpoint 2>/dev/null | sort -u)
          for f in $files; do
            echo "===== $f ====="
            sed -n '1,1200p' "$f"
          done
