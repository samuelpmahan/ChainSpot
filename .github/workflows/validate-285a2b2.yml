name: validate-285a2b2

on:
  push:
    branches:
      - validation/run-285a2b2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ChainSpot commit
        uses: actions/checkout@v4
        with:
          ref: 285a2b2baaa7dc11fd5dee08074206b72f415822
          path: ChainSpot
          fetch-depth: 1

      - name: Checkout corpus sibling
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Install
        working-directory: ChainSpot
        run: |
          npm ci
          ./lab setup

      - name: Run NorthPark through G4
        working-directory: ChainSpot
        run: ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json NorthPark

      - name: Profile emitted artifacts
        working-directory: ChainSpot
        if: always()
        run: |
          echo '=== FILES ==='
          find artifacts/sweep -type f -printf '%p\n' | sort
          echo '=== BATCH ==='
          find artifacts/sweep -path '*/batches/summary.txt' -exec cat {} \;
          echo '=== DURATION FIELDS ==='
          grep -R -n 'durationMs' artifacts/sweep || true
          echo '=== OPERATION / TIMING LINES ==='
          grep -R -n -E 'operation|duration|elapsed|ms=' artifacts/sweep --include='*.txt' --include='*.json' | head -1000 || true
          echo '=== NORTHPARK RECEIPT ==='
          find artifacts/sweep -path '*/NorthPark/full/run.receipt.txt' -exec cat {} \;

      - name: Upload NorthPark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northpark-285a2b2-g4
          path: ChainSpot/artifacts/sweep
          if-no-files-found: error
          retention-days: 1
