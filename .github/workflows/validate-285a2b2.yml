name: validate-285a2b2

on:
  push:
    branches:
      - validation/run-285a2b2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact ChainSpot commit
        uses: actions/checkout@v4
        with:
          ref: 285a2b2baaa7dc11fd5dee08074206b72f415822
          path: ChainSpot
          fetch-depth: 1

      - name: Checkout corpus sibling
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChainSpot/package-lock.json

      - name: Install root dependencies
        working-directory: ChainSpot
        run: npm ci

      - name: Install LAB runtime
        working-directory: ChainSpot
        run: ./lab setup

      - name: Build algorithm
        working-directory: ChainSpot
        run: npm run build --workspace @chainspot/alg

      - name: Typecheck app
        working-directory: ChainSpot
        run: npm run check

      - name: Focused tee-recovery unit suite
        working-directory: ChainSpot
        run: npx vitest run tests/unit/teeRecoveryFeature.test.ts --reporter=verbose

      - name: Run actual Dev6 LAB sweep through G4
        working-directory: ChainSpot
        run: ./lab sweep batch --through G4 packages/alg/src/detectors/threeFactor/configs/default.json dev

      - name: Print Dev6 batch summary
        working-directory: ChainSpot
        if: always()
        run: |
          echo '=== BATCH SUMMARY ==='
          find artifacts/sweep -path '*/batches/summary.txt' -print -exec cat {} \; || true
          echo '=== PER-COURSE RESULT COUNTS ==='
          find artifacts/sweep -name 'run.receipt.txt' -print0 | while IFS= read -r -d '' f; do
            echo "--- $f"
            grep -E 'results\.(badges|baskets|tees|visibleTees|recoveredTees|phantomTees|assignments)|HOLE ASSIGNMENTS' "$f" || true
            echo 'assignment rows:'
            awk '/HOLE ASSIGNMENTS/{flag=1;next} flag && /^H[0-9]+[[:space:]]*\|/{print}' "$f" || true
          done
