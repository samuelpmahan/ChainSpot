name: validation-lab-hydrate

on:
  push:
    branches:
      - codex/three-factor-dev72-lab
    paths:
      - .github/workflows/validation-lab-hydrate.yml

permissions:
  contents: read

jobs:
  hydrate-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation corpus with LFS
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          ref: main
          path: corpus
          lfs: true
          fetch-depth: 1

      - name: Collect full validation rasters
        shell: bash
        run: |
          set -euo pipefail
          mkdir validation-full
          cp 'corpus/validation/BeaverRanch-Gold/clean/BeaverRanch-Gold-full.PNG' validation-full/
          cp 'corpus/validation/ColetoCreek/clean/ColetoCreek-full.PNG' validation-full/
          cp 'corpus/validation/FountainHills/clean/FountainHills-full.PNG' validation-full/
          cp 'corpus/validation/Seatac/clean/Seatac-full.PNG' validation-full/
          file validation-full/*
          sha256sum validation-full/*

      - name: Upload validation rasters
        uses: actions/upload-artifact@v4
        with:
          name: chainspot-validation-full
          path: validation-full
          if-no-files-found: error
          retention-days: 1
