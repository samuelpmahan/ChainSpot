name: Repair posteriorTeeRecovery bootstrap runner

on:
  push:
    branches:
      - spike/posterior-tee-recovery

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ChainSpot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen corpus inside workspace
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          ref: 2b5913d3f1f6d8f97b0324721a4c5201bd3ed819
          path: chainspot-corpus
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Execute implementation recipe from failed bootstrap
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os
          import subprocess
          import yaml
          from pathlib import Path

          workflow = yaml.safe_load(Path('.github/workflows/posterior-tee-recovery-bootstrap.yml').read_text())
          steps = workflow['jobs']['implement']['steps']
          wanted = {
              'Setup',
              'Wire standalone resolve-only G4 operation',
              'Add posteriorTeeRecovery feature',
              'Add ABFeature integration proof',
              'Replace spike workflow with real ABFeature proof',
              'Generate checked-in config schema',
              'Format, build, and prove',
          }
          env = os.environ.copy()
          env['CHAINSPOT_CORPUS_ROOT'] = str(Path('chainspot-corpus').resolve())
          for step in steps:
              name = step.get('name')
              if name not in wanted:
                  continue
              print(f'\n===== {name} =====', flush=True)
              subprocess.run(step['run'], shell=True, check=True, executable='/bin/bash', env=env)
          PY

      - name: Commit source implementation only
        run: |
          set -euo pipefail
          rm -rf chainspot-corpus
          rm -f artifacts/spikes/posterior-tee-recovery/abfeature-dev6.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/alg/src/detectors/threeFactor/features/g4.posteriorTeeRecovery.ts \
            packages/alg/src/detectors/threeFactor/features/registry.ts \
            packages/alg/src/detectors/threeFactor/gate-sets.ts \
            packages/alg/src/exec/operations.ts \
            packages/alg/src/exec/compile.ts \
            packages/alg/src/detectors/threeFactor/configs/posterior-tee-recovery-on.json \
            packages/alg/src/detectors/threeFactor/configs/threeFactor-config.schema.json \
            tests/unit/posteriorTeeRecoveryFeature.test.ts
          git status --short
          git commit -m "Spike: implement posteriorTeeRecovery ABFeature"
          git push origin HEAD:spike/posterior-tee-recovery
