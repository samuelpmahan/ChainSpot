name: Temporary clean MiddleOut verification

on:
  pull_request:
    branches:
      - integration/middleout-prestaging-final-20260818

permissions:
  contents: write

jobs:
  baseline-known-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prestaging/demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit test config
        run: npx svelte-kit sync
      - name: Prove Annotate Course interaction failures predate MiddleOut
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/annotateCourseKeyboardReview.test.ts \
            tests/unit/annotationRadialMenu.test.ts \
            tests/unit/annotateCourseSidebar.test.ts \
            tests/unit/annotateCourseLocalSnap.test.ts \
            tests/unit/annotateCourseBendDetection.test.ts \
            tests/unit/annotationGuideReactivity.test.ts \
            2>&1 | tee /tmp/prestaging-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "6 failed" /tmp/prestaging-baseline.log
          grep -F "44 failed" /tmp/prestaging-baseline.log
          for file in \
            annotateCourseKeyboardReview.test.ts \
            annotationRadialMenu.test.ts \
            annotateCourseSidebar.test.ts \
            annotateCourseLocalSnap.test.ts \
            annotateCourseBendDetection.test.ts \
            annotationGuideReactivity.test.ts; do
            grep -F "$file" /tmp/prestaging-baseline.log >/dev/null
          done

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/middleout-prestaging-final-20260818
          fetch-depth: 0
      - name: Apply exact candidate UI-only MiddleOut patch
        run: |
          git diff 894854a283b93df784e9d54a5267f1214a99a543 d2dd0595d7bd18671a13111c69d639d753aca253 -- src/lib/components/AnnotationWorkspace.svelte > /tmp/middleout-ui.patch
          git apply --check /tmp/middleout-ui.patch
          git apply /tmp/middleout-ui.patch
          git diff --check
          test "$(git diff --numstat -- src/lib/components/AnnotationWorkspace.svelte | awk '{print $1}')" = "80"
          test "$(git diff --numstat -- src/lib/components/AnnotationWorkspace.svelte | awk '{print $2}')" = "0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Svelte and TypeScript checks
        run: npm run check
      - name: Relevant CV and prestaging invariant tests
        run: |
          npx vitest run \
            tests/unit/basketDetection.test.ts \
            tests/unit/basketDetectionCli.test.ts \
            tests/unit/visionFlags.test.ts \
            tests/unit/rawObjectMaskGreyInterior.test.ts \
            tests/unit/zeroBendChord.test.ts \
            tests/unit/ribbonSegmentationSharing.test.ts \
            tests/unit/pancakeCourseDisplayBasketAnchor.test.ts \
            tests/unit/coursePipelineParity.test.ts
      - name: Production build
        run: npm run build
      - name: Commit verified UI transplant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/AnnotationWorkspace.svelte
          git commit -m "Add MiddleOut diagnostic overlay to current Annotate Course"
          git push origin HEAD:integration/middleout-prestaging-final-20260818
