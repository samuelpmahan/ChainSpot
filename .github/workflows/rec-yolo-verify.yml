name: Rec YOLO verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run MVP CV gate
        run: |
          set +e
          npm run verify:cv -- --json | tee verify-cv.log
          status=${PIPESTATUS[0]}
          echo "verify_exit=$status"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: rec-yolo-verify
          path: verify-cv.log
