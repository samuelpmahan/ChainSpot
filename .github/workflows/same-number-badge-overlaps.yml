name: Same-number badge overlaps

on:
  push:
    branches:
      - lab/pxc-root-mounts

jobs:
  project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout dev corpus with LFS
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @chainspot/alg
      - name: Render grouped overlaps
        run: timeout --signal=TERM 55s node scripts/project-same-number-badges.mjs chainspot-corpus/dev /tmp/same-number-badge-overlaps.png /tmp/same-number-badge-overlaps.json
      - name: Upload grouped projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-number-badge-overlaps
          path: |
            /tmp/same-number-badge-overlaps.png
            /tmp/same-number-badge-overlaps.json
          if-no-files-found: error
