name: G4 Shard Ray Only Experiment

on:
  push:
    branches:
      - experiment/g4-shard-ray-only
    paths:
      - .github/workflows/g4-shard-ray-only-experiment.yml

permissions:
  contents: write

jobs:
  implement-and-compare:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: e13f4a72ad6e41bf39133f177f4e8c20a32242e0
      BRANCH: experiment/g4-shard-ray-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ChainSpot
      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch G4 to shard + ray only
        working-directory: ChainSpot
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          p = Path('packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts')
          s = p.read_text()

          old_imports = """import type { BadgeEvidence, BasketEvidence, RecoveredTeeInput, TeeEvidence, OrientedQuad, ThreeFactorAssignment } from '../types';
          import { statsForPixels, type ComponentStats } from '../components';
          import type { Mask } from '../raster';
          import type { SpriteMatch } from '../endpoints';
          import basketSpriteData from '../assets/basket-sprite.json';
          import { assignThreeFactor, type SearchKnobs } from '../assignment';
          import type { RibbonKnobs } from '../ribbon';
          import type { RoutingKnobs } from '../routing';
          import type { ScoringKnobs, ZfitKnobs } from '../scoring';
          import { zfitFeature } from './g5.zfit';
          import { g4ScoringFeature } from './g4.scoring';
          import { g4SearchFeature } from './g4.search';
          import { g5RibbonFeature } from './g5.ribbon';
          import { g5RoutingFeature } from './g5.routing';
          """
          new_imports = """import type { BadgeEvidence, BasketEvidence, RecoveredTeeInput, TeeEvidence, OrientedQuad } from '../types';
          import { statsForPixels, type ComponentStats } from '../components';
          import type { Mask } from '../raster';
          import type { SpriteMatch } from '../endpoints';
          import basketSpriteData from '../assets/basket-sprite.json';
          """
          if old_imports not in s:
              raise SystemExit('teeRecovery import block drifted')
          s = s.replace(old_imports, new_imports, 1)

          s = s.replace(
              "note: 'Frozen baseline: recover assignment-missing tees when every visible component pixel fits a course-local hollow tee support pointing at its numbered badge; phantom completion remains terminal and default-OFF.',",
              "note: 'G4 endpoint completion: visible tees claim numbered badges by their own pad axis; only ray-unclaimed badges enter shard recovery, and a shard becomes a recovered tee only when every visible pixel fits a course-local hollow tee support pointing at that badge. No path, basket assignment, or G6 decision is consulted.',",
              1,
          )

          old_context = """/** The recovery producer is deliberately assignment anchored.  These are
           * structural views so callers can pass the normal assignment object without
           * coupling this deviation to the assignment implementation. */
          export interface TeeRecoveryAssignmentContext {
          \treadonly assignments: readonly { readonly badgeId: string; readonly basketId: string }[];
          }
          """
          new_context = """/** Legacy-shaped adapter used only inside this file to tell the existing
           * candidate builder which numbered badges are already claimed. These rows are
           * produced locally from G3 tee-pad axes; they are NOT G6 assignments and the
           * basketId placeholder is never read by shard recovery. */
          export interface TeeRecoveryAssignmentContext {
          \treadonly assignments: readonly { readonly badgeId: string; readonly basketId: string }[];
          }
          """
          if old_context not in s:
              raise SystemExit('teeRecovery claim-context block drifted')
          s = s.replace(old_context, new_context, 1)

          marker = """function numberLabel(badge: BadgeEvidence): number | undefined {
          \tif (!/^\\d+$/.test(badge.label ?? '')) return undefined;
          \tconst n = Number(badge.label);
          \treturn Number.isInteger(n) && n > 0 ? n : undefined;
          }
          """
          helper = marker + """

          export interface VisibleTeeBadgeRayClaim {
          \treadonly teeId: string;
          \treadonly badgeId: string;
          \treadonly badgeLabel: string | null;
          \treadonly axisErrorRad: number;
          }

          export interface VisibleTeeBadgeRayResolution {
          \treadonly claims: readonly VisibleTeeBadgeRayClaim[];
          \treadonly ambiguousTeeIds: readonly string[];
          \treadonly conflictedBadgeIds: readonly string[];
          }

          /** Undirected pad axis: theta and theta+pi are the same tee orientation. */
          function undirectedAxisError(axisRad: number, rayRad: number): number {
          \tconst delta = Math.abs(Math.atan2(Math.sin(axisRad - rayRad), Math.cos(axisRad - rayRad)));
          \treturn Math.min(delta, Math.PI - delta);
          }

          /**
           * Cheap G4 ownership testimony for already-visible tees. A tee only claims a
           * numbered badge when exactly one badge lies within the same strict axis
           * tolerance used by recovery, and that badge is uniquely proposed by one tee.
           * Ambiguity therefore widens recovery; it never suppresses evidence.
           */
          export function resolveVisibleTeeBadgeRays(
          \ttees: readonly TeeEvidence[],
          \tbadges: readonly BadgeEvidence[]
          ): VisibleTeeBadgeRayResolution {
          \tconst numbered = badges.filter((badge) => numberLabel(badge) !== undefined);
          \tconst proposals: VisibleTeeBadgeRayClaim[] = [];
          \tconst ambiguousTeeIds: string[] = [];

          \tfor (const tee of tees) {
          \t\tconst pose = tee.pad?.minAreaPose;
          \t\tconst axisRad = pose?.angleRad ?? tee.pad?.angleRad ?? tee.angleRad;
          \t\tconst xPx = pose?.centerXPx ?? tee.pad?.centerXPx ?? tee.xPx;
          \t\tconst yPx = pose?.centerYPx ?? tee.pad?.centerYPx ?? tee.yPx;
          \t\t// Full-pad geometry is the evidence contract for a visible G3 claim.
          \t\tif (!tee.pad || axisRad === null || !Number.isFinite(axisRad)) continue;
          \t\tconst candidates = numbered
          \t\t\t.map((badge) => ({
          \t\t\t\tteeId: tee.detId,
          \t\t\t\tbadgeId: badge.detId,
          \t\t\t\tbadgeLabel: badge.label,
          \t\t\t\taxisErrorRad: undirectedAxisError(
          \t\t\t\t\taxisRad,
          \t\t\t\t\tMath.atan2(badge.cyPx - yPx, badge.cxPx - xPx)
          \t\t\t\t)
          \t\t\t}))
          \t\t\t.filter((candidate) => candidate.axisErrorRad < activeAxisLimitRad)
          \t\t\t.sort((a, b) => a.axisErrorRad - b.axisErrorRad || a.badgeId.localeCompare(b.badgeId));
          \t\tif (candidates.length === 1) proposals.push(candidates[0]!);
          \t\telse if (candidates.length > 1) ambiguousTeeIds.push(tee.detId);
          \t}

          \tconst byBadge = new Map<string, VisibleTeeBadgeRayClaim[]>();
          \tfor (const proposal of proposals) {
          \t\tconst bucket = byBadge.get(proposal.badgeId);
          \t\tif (bucket) bucket.push(proposal);
          \t\telse byBadge.set(proposal.badgeId, [proposal]);
          \t}
          \tconst claims: VisibleTeeBadgeRayClaim[] = [];
          \tconst conflictedBadgeIds: string[] = [];
          \tfor (const [badgeId, bucket] of byBadge) {
          \t\tif (bucket.length === 1) claims.push(bucket[0]!);
          \t\telse conflictedBadgeIds.push(badgeId);
          \t}
          \tclaims.sort((a, b) => a.badgeId.localeCompare(b.badgeId) || a.teeId.localeCompare(b.teeId));
          \tambiguousTeeIds.sort();
          \tconflictedBadgeIds.sort();
          \treturn { claims, ambiguousTeeIds, conflictedBadgeIds };
          }
          """
          if s.count(marker) != 1:
              raise SystemExit('numberLabel marker drifted')
          s = s.replace(marker, helper, 1)

          # The old predecessor diagnostic is assignment-derived archaeology, not recovery evidence.
          s, n = re.subn(
              r"\nfunction targetPredecessors\([\s\S]*?\n}\n\n\nfunction graphCandidateResult",
              "\nfunction graphCandidateResult",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'targetPredecessors removal count={n}')

          s = s.replace(
              "const assignedBadgeIds = new Set(search.assignment?.assignments.map((row) => row.badgeId) ?? []);\n\tconst targets = badges.filter((badge) => numberLabel(badge) !== undefined && !assignedBadgeIds.has(badge.detId));",
              "const claimedBadgeIds = new Set(search.assignment?.assignments.map((row) => row.badgeId) ?? []);\n\tconst targets = badges.filter((badge) => numberLabel(badge) !== undefined && !claimedBadgeIds.has(badge.detId));",
              1,
          )

          s = s.replace(
              "consumes: ['stage', 'badges', 'baskets', 'tees', 'sprites', 'viewport', 'recoveredTees', 'assignment', 'measurement'],\n\tproduces: ['recoveredTees', 'assignment'],",
              "consumes: ['stage', 'badges', 'baskets', 'tees', 'sprites', 'viewport', 'recoveredTees'],\n\tproduces: ['recoveredTees'],",
              1,
          )

          old_unit_head = """\t\tconst baskets = board.get<readonly BasketEvidence[]>('baskets');
          \t\tconst tees = board.get<readonly TeeEvidence[]>('tees');
          \t\tconst assignment = board.get<ThreeFactorAssignment>('assignment');
          \t\tconst measurement = board.get<import('../types').ThreeFactorMeasurement>('measurement');
          \t\tconst badgeIds = new Set(badges.filter((badge) => /^\\d+$/.test(badge.label ?? '')).map((badge) => badge.detId));
          \t\tconst assignedBadgeIds = new Set(assignment.assignments.map((entry) => entry.badgeId));
          \t\tif ([...badgeIds].every((badgeId) => assignedBadgeIds.has(badgeId))) {
          \t\t\tctx.measure('teeRecovery', 'missingNumberedTees', 0);
          \t\t\tboard.set('recoveredTees', board.get<readonly RecoveredTeeInput[]>('recoveredTees'));
          \t\t\tboard.set('assignment', assignment);
          \t\t\tstop();
          \t\t\treturn;
          \t\t}
          \t\tconst shardDiscoveryStop = ctx.span('teeRecovery.shardDiscovery');
          \t\tconst sprites = board.has('sprites') ? board.get<readonly SpriteMatch[]>('sprites') : undefined;
          \t\tctx.occlusion.registerOpaque(basketOpaqueProvider(stage, baskets, sprites, viewportTopPx));
          \t\tconst built = buildTeeRecoveryCandidates(stage, badges, baskets, tees, viewportTopPx, { assignment, sprites, occlusion: ctx.occlusion });
          """
          new_unit_head = """\t\tconst baskets = board.get<readonly BasketEvidence[]>('baskets');
          \t\tconst tees = board.get<readonly TeeEvidence[]>('tees');
          \t\tconst rayResolution = resolveVisibleTeeBadgeRays(tees, badges);
          \t\tconst claimedBadgeIds = new Set(rayResolution.claims.map((claim) => claim.badgeId));
          \t\tconst numberedBadges = badges.filter((badge) => numberLabel(badge) !== undefined);
          \t\tctx.measure('teeRecovery', 'visibleRayClaims', rayResolution.claims.length);
          \t\tctx.measure('teeRecovery', 'visibleRayAmbiguousTees', rayResolution.ambiguousTeeIds.length);
          \t\tctx.measure('teeRecovery', 'visibleRayConflictedBadges', rayResolution.conflictedBadgeIds.length);
          \t\tctx.measure('teeRecovery', 'missingNumberedTees', numberedBadges.length - claimedBadgeIds.size);
          \t\tfor (const claim of rayResolution.claims) {
          \t\t\tconst tee = tees.find((candidate) => candidate.detId === claim.teeId);
          \t\t\tconst badge = badges.find((candidate) => candidate.detId === claim.badgeId);
          \t\t\tif (!tee || !badge) continue;
          \t\t\tctx.overlay('teeRecovery', {
          \t\t\t\ttype: 'polyline',
          \t\t\t\tpath: [[tee.xPx, tee.yPx], [badge.cxPx, badge.cyPx]],
          \t\t\t\tverdict: 'info',
          \t\t\t\tvisualRole: 'tee-badge-path',
          \t\t\t\tref: `visible-ray-${tee.detId}-${badge.detId}`,
          \t\t\t\treason: `visible ${tee.detId} uniquely claims badge ${badge.label ?? badge.detId} by its own undirected pad axis (${(claim.axisErrorRad * 180 / Math.PI).toFixed(3)}° < ${activeAxisLimitDeg}°); no pathfinding or assignment testimony read`
          \t\t\t});
          \t\t}
          \t\tif (claimedBadgeIds.size === numberedBadges.length) {
          \t\t\tboard.set('recoveredTees', board.get<readonly RecoveredTeeInput[]>('recoveredTees'));
          \t\t\tstop();
          \t\t\treturn;
          \t\t}
          \t\tconst localRayClaims: TeeRecoveryAssignmentContext = {
          \t\t\tassignments: [...claimedBadgeIds].sort().map((badgeId) => ({ badgeId, basketId: 'G4-visible-ray' }))
          \t\t};
          \t\tconst shardDiscoveryStop = ctx.span('teeRecovery.shardDiscovery');
          \t\tconst sprites = board.has('sprites') ? board.get<readonly SpriteMatch[]>('sprites') : undefined;
          \t\tctx.occlusion.registerOpaque(basketOpaqueProvider(stage, baskets, sprites, viewportTopPx));
          \t\tconst built = buildTeeRecoveryCandidates(stage, badges, baskets, tees, viewportTopPx, { assignment: localRayClaims, sprites, occlusion: ctx.occlusion });
          """
          if old_unit_head not in s:
              raise SystemExit('teeRecovery unit head drifted')
          s = s.replace(old_unit_head, new_unit_head, 1)

          old_dedupe = """\t\t// Footgun fix (2026-08-28 inventory): this dedupe distance already has a
          \t\t// config-provenanced knob (g4.search.ts's `recoveredTeeDedupeDistance`,
          \t\t// default 14) that was resolved further below for reassignment but never
          \t\t// actually consumed here -- the literal `14` was live instead. Resolve
          \t\t// once, up front, and use it for every check below.
          \t\tconst searchKnobs = ctx.resolve(g4SearchFeature).knobs as unknown as SearchKnobs;
          \t\tconst dedupeDistancePx = searchKnobs.recoveredTeeDedupeDistance;
          """
          new_dedupe = """\t\t// No G6 search knob is allowed to decide whether G4 observed a tee.
          \t\t// The same source component is already settled by cross-target ambiguity;
          \t\t// only byte-identical centers from an injected/repeated recovery are deduped here.
          """
          if old_dedupe not in s:
              raise SystemExit('teeRecovery dedupe block drifted')
          s = s.replace(old_dedupe, new_dedupe, 1)

          old_dup = """\t\t\tconst duplicate = tees.some((tee) => Math.hypot(tee.xPx - centerX, tee.yPx - centerY) < dedupeDistancePx) ||
          \t\t\t\texisting.some((tee) => Math.hypot(tee.xPx - centerX, tee.yPx - centerY) < dedupeDistancePx) ||
          \t\t\t\tadditions.some((tee) => Math.hypot(tee.xPx - centerX, tee.yPx - centerY) < dedupeDistancePx);
          \t\t\tif (duplicate && result.verdict === 'accepted') {
          \t\t\t\tctx.measure('teeRecovery', 'duplicateSuppressed', 1);
          \t\t\t\tctx.overlay('teeRecovery', { type: 'point', xPx: centerX, yPx: centerY, verdict: 'rejected', visualRole: 'tee-rejection', ref: `${result.id}:duplicate`, reason: `recovery center within ${dedupeDistancePx}px of an existing tee (knob recoveredTeeDedupeDistance); duplicate suppressed`, values: numericTraceValues(result.values) });
          \t\t\t\tcontinue;
          \t\t\t}
          """
          new_dup = """\t\t\tconst duplicate = existing.some((tee) => tee.xPx === centerX && tee.yPx === centerY) ||
          \t\t\t\tadditions.some((tee) => tee.xPx === centerX && tee.yPx === centerY);
          \t\t\tif (duplicate && result.verdict === 'accepted') {
          \t\t\t\tctx.measure('teeRecovery', 'duplicateSuppressed', 1);
          \t\t\t\tctx.overlay('teeRecovery', { type: 'point', xPx: centerX, yPx: centerY, verdict: 'rejected', visualRole: 'tee-rejection', ref: `${result.id}:duplicate`, reason: 'exact recovered center already exists; duplicate suppressed without a proximity/search heuristic', values: numericTraceValues(result.values) });
          \t\t\t\tcontinue;
          \t\t\t}
          """
          if old_dup not in s:
              raise SystemExit('teeRecovery duplicate predicate drifted')
          s = s.replace(old_dup, new_dup, 1)

          old_tail = """\t\tboard.set('recoveredTees', [...existing, ...additions]);
          \t\tif (additions.length > 0 && measurement.rawPairs.length > 0) {
          \t\t\tconst zfit = ctx.resolve(zfitFeature).knobs as unknown as ZfitKnobs;
          \t\t\tconst scoring = ctx.resolve(g4ScoringFeature).knobs as unknown as ScoringKnobs;
          \t\t\tconst ribbon = ctx.resolve(g5RibbonFeature).knobs as unknown as RibbonKnobs;
          \t\t\tconst routing = ctx.resolve(g5RoutingFeature).knobs as unknown as RoutingKnobs;
          \t\t\tboard.set('assignment', assignThreeFactor(measurement, [...existing, ...additions], zfit, scoring, searchKnobs, ribbon, routing));
          \t\t} else {
          \t\t\tif (additions.length > 0) ctx.measure('teeRecovery', 'reassignmentSkippedNoRawPairs', 1);
          \t\t\tboard.set('assignment', assignment);
          \t\t}
          """
          new_tail = """\t\tboard.set('recoveredTees', [...existing, ...additions]);
          """
          if old_tail not in s:
              raise SystemExit('teeRecovery reassignment tail drifted')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s)

          # Operation wrapper: G4 emits recoveredTees and stops. No hidden replay.
          replace_once(
              'packages/alg/src/exec/operations.ts',
              """\t\t\tproduces: [...teeRecoveryUnit.produces, 'assignment.tees', 'assignment.rawPairs'],
          \t\t\tfeatures: [teeRecoveryFeature.id],
          \t\t\tnote: teeRecoveryUnit.note
          \t\t},
          \t\trun(board, ctx) {
          \t\t\tteeRecoveryUnit.run(asLegacyBoard(board), ctx);
          \t\t\t// Recovery reruns assignment without mutating the immutable G5
          \t\t\t// measurement. Republish its final inventory and routes into the
          \t\t\t// downstream assignment slots so G7 never reads the pre-recovery 15-tee
          \t\t\t// state after G4 has produced an 18-tee assignment.
          \t\t\tconst assignment = board.get<ThreeFactorAssignment>('assignment');
          \t\t\tboard.set('assignment.tees', assignment.tees);
          \t\t\tboard.set(
          \t\t\t\t'assignment.rawPairs',
          \t\t\t\tassignment.scoredPairs.map((pair) => pair.raw)
          \t\t\t);
          \t\t}
          """,
              """\t\t\tproduces: teeRecoveryUnit.produces,
          \t\t\tfeatures: [teeRecoveryFeature.id],
          \t\t\tnote: teeRecoveryUnit.note
          \t\t},
          \t\trun: (board, ctx) => teeRecoveryUnit.run(asLegacyBoard(board), ctx)
          """,
          )

          # Frozen no-config front door follows the semantic chronology too.
          replace_once(
              'packages/alg/src/detectors/threeFactor/engine.ts',
              """\t'teeFamily',
          \t...DEFAULT_MEASURE_EXECUTION.slice(DEFAULT_MEASURE_EXECUTION.indexOf('tees') + 1),
          \t'assignment',
          \t'teeRecovery',
          \t'zfit'
          """,
              """\t'teeFamily',
          \t'teeRecovery',
          \t...DEFAULT_MEASURE_EXECUTION.slice(DEFAULT_MEASURE_EXECUTION.indexOf('tees') + 1),
          \t'assignment',
          \t'zfit'
          """,
          )

          # Every saved config that schedules recovery now schedules it immediately
          # after the completed visible-tee family, before G5/G6 heavy evidence.
          for config in Path('packages/alg/src/detectors/threeFactor/configs').glob('*.json'):
              text = config.read_text()
              if '\n\t\t"teeRecovery"' not in text:
                  continue
              lines = text.splitlines()
              recovery = [i for i, line in enumerate(lines) if line.strip().startswith('"teeRecovery"') and 'enabled' not in line]
              if not recovery:
                  continue
              # Only execution-array entries have this indentation.
              recovery = [i for i in recovery if lines[i].startswith('\t\t"teeRecovery"')]
              if len(recovery) != 1:
                  raise SystemExit(f'{config}: expected one execution teeRecovery row, got {recovery}')
              row = lines.pop(recovery[0])
              anchors = [i for i, line in enumerate(lines) if line == '\t\t"teeFamily",']
              if len(anchors) != 1:
                  raise SystemExit(f'{config}: teeRecovery config lacks unique teeFamily execution anchor')
              lines.insert(anchors[0] + 1, row)
              config.write_text('\n'.join(lines) + '\n')

          # Human-facing notes: remove the stale post-assignment claim where present.
          for config in Path('packages/alg/src/detectors/threeFactor/configs').glob('*.json'):
              text = config.read_text()
              text = text.replace('post-assignment tee-shard recovery', 'ray-gated tee-shard recovery')
              text = text.replace('recovers assignment-missing tees', 'ray-claims visible tees then recovers ray-unclaimed tees')
              config.write_text(text)

          print('patched files:')
          for path in [
              'packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts',
              'packages/alg/src/exec/operations.ts',
              'packages/alg/src/detectors/threeFactor/engine.ts',
          ]:
              print(' ', path)
          PY

      - name: Build and focused tests
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          npm ci
          npm --workspace @chainspot/alg run build
          npm run test:unit -- tests/unit/exec.compile.test.ts tests/unit/abFeatureSet.test.ts tests/unit/dashsTrackSweep.test.ts 2>&1 | tee /tmp/focused-tests.log || true
          npm run check 2>&1 | tee /tmp/check.log

      - name: Commit experiment implementation
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          git config user.name 'ChainSpot G4 Experiment'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts \
                  packages/alg/src/detectors/threeFactor/engine.ts \
                  packages/alg/src/detectors/threeFactor/configs \
                  packages/alg/src/exec/operations.ts
          git commit -m '[g4-ray-only] Remove G5/G6 dependency from tee recovery'
          echo "EXPERIMENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Baseline Dev6
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          git checkout --force "$BASE_SHA"
          ./lab setup >/tmp/base-setup.log 2>&1
          rm -rf artifacts/sweep
          ./lab sweep batch packages/alg/src/detectors/threeFactor/configs/default.json dev > /tmp/base-sweep.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          rows={}
          for p in Path('artifacts/sweep').rglob('run.receipt.json'):
              d=json.loads(p.read_text())
              key=p.parent.name
              rows[key]={
                  'results':d.get('results',{}),
                  'assignments':{str(a.get('hole')): [a.get('teeId'),a.get('basketId')] for a in d.get('assignments',[])},
              }
          Path('/tmp/base-summary.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          print(Path('/tmp/base-summary.json').read_text())
          PY

      - name: Shard-ray-only Dev6
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          git checkout --force "$EXPERIMENT_SHA"
          ./lab setup >/tmp/experiment-setup.log 2>&1
          rm -rf artifacts/sweep
          ./lab sweep batch packages/alg/src/detectors/threeFactor/configs/default.json dev > /tmp/experiment-sweep.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          rows={}
          order={}
          for p in Path('artifacts/sweep').rglob('run.receipt.json'):
              d=json.loads(p.read_text())
              key=p.parent.name
              rows[key]={
                  'results':d.get('results',{}),
                  'assignments':{str(a.get('hole')): [a.get('teeId'),a.get('basketId')] for a in d.get('assignments',[])},
              }
              order[key]=[f"{o.get('gate')}:{o.get('id')}" for o in d.get('operations',[])]
          Path('/tmp/experiment-summary.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          print(Path('/tmp/experiment-summary.json').read_text())
          print('OPERATION ORDER')
          print(json.dumps(order,sort_keys=True,indent=2))
          base=json.loads(Path('/tmp/base-summary.json').read_text())
          print('=== SEMANTIC DIFF ===')
          keys=sorted(set(base)|set(rows))
          for key in keys:
              b=base.get(key,{}); e=rows.get(key,{})
              if b != e:
                  print(f'COURSE {key}')
                  print(' baseline results', b.get('results'))
                  print(' experiment results', e.get('results'))
                  ba=b.get('assignments',{}); ea=e.get('assignments',{})
                  for hole in sorted(set(ba)|set(ea), key=lambda x: (x=='UNREAD', int(x) if str(x).isdigit() else 999)):
                      if ba.get(hole)!=ea.get(hole):
                          print(f'  H{hole}: {ba.get(hole)} -> {ea.get(hole)}')
          PY

      - name: Push experiment commit
        working-directory: ChainSpot
        if: always()
        run: |
          git checkout --force "$EXPERIMENT_SHA"
          git push origin "$EXPERIMENT_SHA:refs/heads/$BRANCH"

      - name: Show focused test/check status
        if: always()
        run: |
          echo '--- focused tests tail ---'
          tail -n 80 /tmp/focused-tests.log 2>/dev/null || true
          echo '--- check tail ---'
          tail -n 40 /tmp/check.log 2>/dev/null || true
