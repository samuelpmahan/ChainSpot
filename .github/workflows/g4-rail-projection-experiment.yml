name: G4 Rail Projection Experiment

on:
  push:
    branches: [experiment/g4-shard-ray-only]
    paths: [.github/workflows/g4-rail-projection-experiment.yml]

permissions:
  contents: write

jobs:
  rail-projection:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: e13f4a72ad6e41bf39133f177f4e8c20a32242e0
      BRANCH: experiment/g4-shard-ray-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ChainSpot
      - uses: actions/checkout@v4
        with:
          repository: samuelpmahan/chainspot-corpus
          path: chainspot-corpus
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace angle fitting with rail projection where rail evidence exists
        working-directory: ChainSpot
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts')
          s=p.read_text()

          old="""\treadonly angleRad: number;
          \t/** Width of the observed course-local support band.  This is derived from
          \t * the intact pads' area, not from a renderer/template constant. */
          \treadonly supportThicknessPx?: number;
          """
          new="""\treadonly angleRad: number;
          \t/** Width of the observed course-local support band.  This is derived from
          \t * the intact pads' area, not from a renderer/template constant. */
          \treadonly supportThicknessPx?: number;
          \t/** A rail projection is determined by observed pixels + known tee size;
          \t * the badge is only measured against the projected lane, never used to
          \t * rotate/search the tee pose. */
          \treadonly fitKind?: 'support-search' | 'rail-projection';
          \treadonly badgePerpendicularErrorPx?: number;
          \treadonly badgePerpendicularMissPx?: number;
          \treadonly projectedLaneWidthPx?: number;
          \treadonly observedRailSpanPx?: number;
          """
          if s.count(old)!=1: raise SystemExit('RecoveryFit anchor drifted')
          s=s.replace(old,new,1)

          old="""\treadonly fullSpanComponentLocalization?: number;
          }
          """
          new="""\treadonly fullSpanComponentLocalization?: number;
          \treadonly badgePerpendicularErrorPx?: number;
          \treadonly badgePerpendicularMissPx?: number;
          \treadonly projectedLaneWidthPx?: number;
          \treadonly observedRailSpanPx?: number;
          \treadonly railProjection?: number;
          }
          """
          if s.count(old)!=1: raise SystemExit('TeeRecoveryValues anchor drifted')
          s=s.replace(old,new,1)

          # Replace visible tee angle cone with finite-width projected half-rails.
          start=s.index('export function resolveVisibleTeeBadgeRays(')
          end=s.index('\nfunction exactBasketPixels(', start)
          replacement=r'''export function resolveVisibleTeeBadgeRays(
	tees: readonly TeeEvidence[],
	badges: readonly BadgeEvidence[]
): VisibleTeeBadgeRayResolution {
	const numbered = badges.filter((badge) => numberLabel(badge) !== undefined);
	const proposals: VisibleTeeBadgeRayClaim[] = [];
	const ambiguousTeeIds: string[] = [];

	for (const tee of tees) {
		const pose = tee.pad?.minAreaPose;
		const axisRad = pose?.angleRad ?? tee.pad?.angleRad ?? tee.angleRad;
		const xPx = pose?.centerXPx ?? tee.pad?.centerXPx ?? tee.xPx;
		const yPx = pose?.centerYPx ?? tee.pad?.centerYPx ?? tee.yPx;
		const majorPx = pose?.majorPx ?? tee.pad?.majorPx;
		const minorPx = pose?.minorPx ?? tee.pad?.minorPx;
		if (!tee.pad || axisRad === null || !Number.isFinite(axisRad) || !majorPx || !minorPx) continue;
		const c = Math.cos(axisRad), ss = Math.sin(axisRad);
		const halfLane = minorPx / 2 + RASTER_TOLERANCE_PX;
		const halfPad = majorPx / 2;
		const byDirection = new Map<-1 | 1, VisibleTeeBadgeRayClaim[]>();
		for (const badge of numbered) {
			const dx = badge.cxPx - xPx;
			const dy = badge.cyPx - yPx;
			const along = dx * c + dy * ss;
			const perpendicular = Math.abs(-dx * ss + dy * c);
			if (perpendicular > halfLane || Math.abs(along) <= halfPad) continue;
			const direction = (along < 0 ? -1 : 1) as -1 | 1;
			const bucket = byDirection.get(direction) ?? [];
			bucket.push({
				teeId: tee.detId,
				badgeId: badge.detId,
				badgeLabel: badge.label,
				// Keep the existing field name for trace compatibility. The value is
				// now the equivalent center-axis angle only as presentation; gating
				// above is entirely the projected tee-width perpendicular test.
				axisErrorRad: undirectedAxisError(axisRad, Math.atan2(dy, dx))
			});
			byDirection.set(direction, bucket);
		}
		const firstIntercepts: VisibleTeeBadgeRayClaim[] = [];
		for (const [direction, bucket] of byDirection) {
			bucket.sort((a, b) => {
				const badgeA = numbered.find((badge) => badge.detId === a.badgeId)!;
				const badgeB = numbered.find((badge) => badge.detId === b.badgeId)!;
				const alongA = (badgeA.cxPx - xPx) * c + (badgeA.cyPx - yPx) * ss;
				const alongB = (badgeB.cxPx - xPx) * c + (badgeB.cyPx - yPx) * ss;
				return Math.abs(alongA) - Math.abs(alongB) || a.badgeId.localeCompare(b.badgeId);
			});
			if (bucket[0]) firstIntercepts.push(bucket[0]);
		}
		if (firstIntercepts.length === 1) proposals.push(firstIntercepts[0]!);
		else if (firstIntercepts.length > 1) ambiguousTeeIds.push(tee.detId);
	}

	const byBadge = new Map<string, VisibleTeeBadgeRayClaim[]>();
	for (const proposal of proposals) {
		const bucket = byBadge.get(proposal.badgeId);
		if (bucket) bucket.push(proposal);
		else byBadge.set(proposal.badgeId, [proposal]);
	}
	const claims: VisibleTeeBadgeRayClaim[] = [];
	const conflictedBadgeIds: string[] = [];
	for (const [badgeId, bucket] of byBadge) {
		if (bucket.length === 1) claims.push(bucket[0]!);
		else conflictedBadgeIds.push(badgeId);
	}
	claims.sort((a, b) => a.badgeId.localeCompare(b.badgeId) || a.teeId.localeCompare(b.teeId));
	ambiguousTeeIds.sort();
	conflictedBadgeIds.sort();
	return { claims, ambiguousTeeIds, conflictedBadgeIds };
}
'''
          s=s[:start]+replacement+s[end:]

          marker='''function fitComponent(
	pixels: readonly [number, number][],
	component: ComponentStats,
	target: BadgeEvidence,
	viewportTopPx: number,
	halfWidth: number,
	halfHeight: number,
	thickness: number
): RecoveryFit {
'''
          if s.count(marker)!=1: raise SystemExit('fitComponent marker drifted')
          helper=r'''/**
 * If the surviving component is a rail, do not fit a rectangle to the badge.
 * The rail determines orientation. The known course-local tee width determines
 * the parallel centerline. The badge contributes only a perpendicular residual
 * against that projection, in pixels.
 */
function projectRailFit(
	pixels: readonly [number, number][],
	component: ComponentStats,
	target: BadgeEvidence,
	viewportTopPx: number,
	halfWidth: number,
	halfHeight: number,
	thickness: number
): RecoveryFit | undefined {
	if (pixels.length < 2) return undefined;
	const exact = exactVisibleStats(component.label, pixels) ?? component;
	const angle = exact.angle;
	if (!Number.isFinite(angle)) return undefined;
	const c = Math.cos(angle), ss = Math.sin(angle);
	const nx = -ss, ny = c;
	let minAlong = Infinity, maxAlong = -Infinity;
	let minNormal = Infinity, maxNormal = -Infinity;
	for (const [x, y] of pixels) {
		const dx = x - exact.cx, dy = y - exact.cy;
		const along = dx * c + dy * ss;
		const normal = dx * nx + dy * ny;
		minAlong = Math.min(minAlong, along);
		maxAlong = Math.max(maxAlong, along);
		minNormal = Math.min(minNormal, normal);
		maxNormal = Math.max(maxNormal, normal);
	}
	const railSpan = maxAlong - minAlong;
	const railThickness = maxNormal - minNormal;
	const allowedRailThickness = Math.max(0, thickness) + 2 * RASTER_TOLERANCE_PX;
	// This is the ONLY rail classifier. It is stated entirely in measured tee
	// geometry: a border rail may be as long as the known major side but may not
	// be thicker than the measured course-local border band + raster allowance.
	if (railThickness > allowedRailThickness || railSpan > 2 * halfWidth + 2 * RASTER_TOLERANCE_PX) {
		return undefined;
	}

	// Any center whose longitudinal interval covers all observed rail pixels is
	// legal. Choose the point nearest the observed rail centroid; the badge does
	// not participate in longitudinal localization.
	const lowCenterAlong = maxAlong - halfWidth;
	const highCenterAlong = minAlong + halfWidth;
	if (lowCenterAlong > highCenterAlong + RASTER_TOLERANCE_PX) return undefined;
	const centerAlong = Math.max(lowCenterAlong, Math.min(highCenterAlong, 0));

	const badgeX = target.cxPx;
	const badgeY = target.cyPx - viewportTopPx;
	const badgeNormalFromRail = (badgeX - exact.cx) * nx + (badgeY - exact.cy) * ny;
	// The observed rail is one longitudinal border. The known tee width gives
	// exactly two possible centerlines, +/- halfHeight away. Pick the side with
	// the smaller perpendicular residual. This is the ONLY badge contribution.
	const plusError = Math.abs(badgeNormalFromRail - halfHeight);
	const minusError = Math.abs(badgeNormalFromRail + halfHeight);
	const side = plusError <= minusError ? 1 : -1;
	const perpendicularError = Math.min(plusError, minusError);
	const laneHalfWidth = halfHeight + RASTER_TOLERANCE_PX;
	const perpendicularMiss = Math.max(0, perpendicularError - laneHalfWidth);
	return {
		centerXPx: exact.cx + centerAlong * c + side * halfHeight * nx,
		centerYPx: exact.cy + centerAlong * ss + side * halfHeight * ny,
		halfWidthPx: halfWidth,
		halfHeightPx: halfHeight,
		angleRad: angle,
		supportThicknessPx: thickness,
		fitKind: 'rail-projection',
		badgePerpendicularErrorPx: perpendicularError,
		badgePerpendicularMissPx: perpendicularMiss,
		projectedLaneWidthPx: halfHeight * 2,
		observedRailSpanPx: railSpan
	};
}

'''+marker
          s=s.replace(marker,helper,1)

          # A rail gets exactly one projection. It cannot fall back to badge-driven pose search.
          old='''\t// A shard centroid is not a tee center. Solve the actual existence question:
          \t// search the small center region capable of containing every visible pixel;
          \t// at each center, constrain the tee major axis to within three degrees of
          \t// the center-to-badge ray and test every pixel against the hollow support.
          \tconst outerRadius = Math.hypot(
          '''
          new='''\tconst projectedRail = projectRailFit(pixels, component, target, viewportTopPx, halfWidth, halfHeight, thickness);
          \tif (projectedRail) return projectedRail;
          \t// No rail testimony: retain the older full-support feasibility search as
          \t// fallback for genuinely non-rail fragments only.
          \tconst outerRadius = Math.hypot(
          '''
          if s.count(old)!=1: raise SystemExit('fitComponent body anchor drifted')
          s=s.replace(old,new,1)

          # Mark old searched fits explicitly for receipts.
          old='''\t\tangleRad: Math.atan2(badgeY - component.cy, badgeX - component.cx),
          \t\tsupportThicknessPx: thickness
          \t};
          '''
          new='''\t\tangleRad: Math.atan2(badgeY - component.cy, badgeX - component.cx),
          \t\tsupportThicknessPx: thickness,
          \t\tfitKind: 'support-search'
          \t};
          '''
          if s.count(old)!=1: raise SystemExit('fallback fit anchor drifted')
          s=s.replace(old,new,1)
          old='''\t\t\t\tangleRad: badgeRay + axisOffset.rad,
          \t\t\t\tsupportThicknessPx: thickness
          \t\t\t};
          '''
          new='''\t\t\t\tangleRad: badgeRay + axisOffset.rad,
          \t\t\t\tsupportThicknessPx: thickness,
          \t\t\t\tfitKind: 'support-search'
          \t\t\t};
          '''
          if s.count(old)!=1: raise SystemExit('searched fit anchor drifted')
          s=s.replace(old,new,1)

          # Rail projection uses perpendicular miss; non-rail fallback keeps legacy angle gate.
          old='''\tconst axisError = badgeAxisError(candidate);
          \tconst axisRejected = candidate.badgeLabel !== null && candidate.badgeLabel !== undefined && /^\\d+$/.test(candidate.badgeLabel) && (axisError ?? Infinity) >= activeAxisLimitRad;
          '''
          new='''\tconst axisError = badgeAxisError(candidate);
          \tconst railMissPx = candidate.fit.fitKind === 'rail-projection' ? candidate.fit.badgePerpendicularMissPx ?? Infinity : undefined;
          \tconst axisRejected = candidate.badgeLabel !== null && candidate.badgeLabel !== undefined && /^\\d+$/.test(candidate.badgeLabel) && (
          \t\trailMissPx !== undefined ? railMissPx > 0 : (axisError ?? Infinity) >= activeAxisLimitRad
          \t);
          '''
          if s.count(old)!=1: raise SystemExit('graph axis gate anchor drifted')
          s=s.replace(old,new,1)

          old='''\t\t: `${holePrefix}${searchScope}; ${insufficientSupport
          \t\t\t\t? `visible component support ${support} < ${MIN_SHARD_SUPPORT_PIXELS}`
          \t\t\t\t: `${axisRejected
          \t\t\t\t\t? `badge-axis angular error ${(axisError! * 180 / Math.PI).toFixed(3)}° is not < ${activeAxisLimitDeg}° (knob axisToleranceDeg; soft ceiling, target P100 5° then ${BADGE_AXIS_TARGET_DEG}°)`
          \t\t\t\t\t: `no hollow tee support fit within ${activeAxisLimitDeg}° of the badge ray explains every visible component pixel (knob axisToleranceDeg; soft ceiling, target P100 5° then ${BADGE_AXIS_TARGET_DEG}°)`}${unexplained.length ? pixelEvidence : '; visible component pixels otherwise lie on the fitted support footprint'}`}`;
          '''
          new='''\t\t: `${holePrefix}${searchScope}; ${insufficientSupport
          \t\t\t\t? `visible component support ${support} < ${MIN_SHARD_SUPPORT_PIXELS}`
          \t\t\t\t: `${axisRejected
          \t\t\t\t\t? candidate.fit.fitKind === 'rail-projection'
          \t\t\t\t\t\t? `observed rail projected at the known tee width misses the badge center by ${(candidate.fit.badgePerpendicularMissPx ?? Infinity).toFixed(3)}px beyond the legal tee-width lane (centerline perpendicular error ${(candidate.fit.badgePerpendicularErrorPx ?? Infinity).toFixed(3)}px)`
          \t\t\t\t\t\t: `badge-axis angular error ${(axisError! * 180 / Math.PI).toFixed(3)}° is not < ${activeAxisLimitDeg}° (non-rail fallback only)`
          \t\t\t\t\t: candidate.fit.fitKind === 'rail-projection'
          \t\t\t\t\t\t? `rail projection passes: badge center lies inside the known tee-width lane; no badge-driven pose search was performed`
          \t\t\t\t\t\t: `no hollow tee support fit within ${activeAxisLimitDeg}° of the badge ray explains every visible component pixel (non-rail fallback only)`}${unexplained.length ? pixelEvidence : '; visible component pixels otherwise lie on the fitted support footprint'}`}`;
          '''
          if s.count(old)!=1: raise SystemExit('graph reason anchor drifted')
          s=s.replace(old,new,1)

          old='''\t\t\t...(axisError === undefined ? {} : { badgeAxisAlignment: Math.cos(axisError), badgeAxisErrorRad: axisError }),
          \t\t\t...(unexplained.length ? { unexplainedVisiblePixels: unexplained.length } : {})
          '''
          new='''\t\t\t...(axisError === undefined ? {} : { badgeAxisAlignment: Math.cos(axisError), badgeAxisErrorRad: axisError }),
          \t\t\t...(candidate.fit.fitKind === 'rail-projection' ? {
          \t\t\t\tbadgePerpendicularErrorPx: candidate.fit.badgePerpendicularErrorPx ?? Infinity,
          \t\t\t\tbadgePerpendicularMissPx: candidate.fit.badgePerpendicularMissPx ?? Infinity,
          \t\t\t\tprojectedLaneWidthPx: candidate.fit.projectedLaneWidthPx ?? 0,
          \t\t\t\tobservedRailSpanPx: candidate.fit.observedRailSpanPx ?? 0,
          \t\t\t\trailProjection: 1
          \t\t\t} : {}),
          \t\t\t...(unexplained.length ? { unexplainedVisiblePixels: unexplained.length } : {})
          '''
          if s.count(old)!=1: raise SystemExit('graph values anchor drifted')
          s=s.replace(old,new,1)

          # Candidate ranking: accepted rail projections rank by perpendicular residual, not angle.
          old='''\t\t\tconst aa = badgeAxisError(a) ?? Infinity, ba = badgeAxisError(b) ?? Infinity;
          \t\t\tconst aAccepted = a.fragmentPixels.length >= MIN_SHARD_SUPPORT_PIXELS && ar === 0 && aa < activeAxisLimitRad;
          \t\t\tconst bAccepted = b.fragmentPixels.length >= MIN_SHARD_SUPPORT_PIXELS && br === 0 && ba < activeAxisLimitRad;
          \t\t\tif (aAccepted !== bAccepted) return aAccepted ? -1 : 1;
          \t\t\tif (aAccepted) return b.fragmentPixels.length - a.fragmentPixels.length || aa - ba || a.supportingComponentIds[0]!.localeCompare(b.supportingComponentIds[0]!);
          '''
          new='''\t\t\tconst aa = badgeAxisError(a) ?? Infinity, ba = badgeAxisError(b) ?? Infinity;
          \t\t\tconst aRailMiss = a.fit.fitKind === 'rail-projection' ? a.fit.badgePerpendicularMissPx ?? Infinity : undefined;
          \t\t\tconst bRailMiss = b.fit.fitKind === 'rail-projection' ? b.fit.badgePerpendicularMissPx ?? Infinity : undefined;
          \t\t\tconst aAccepted = a.fragmentPixels.length >= MIN_SHARD_SUPPORT_PIXELS && ar === 0 && (aRailMiss !== undefined ? aRailMiss === 0 : aa < activeAxisLimitRad);
          \t\t\tconst bAccepted = b.fragmentPixels.length >= MIN_SHARD_SUPPORT_PIXELS && br === 0 && (bRailMiss !== undefined ? bRailMiss === 0 : ba < activeAxisLimitRad);
          \t\t\tif (aAccepted !== bAccepted) return aAccepted ? -1 : 1;
          \t\t\tif (aAccepted) {
          \t\t\t\tconst aResidual = a.fit.fitKind === 'rail-projection' ? a.fit.badgePerpendicularErrorPx ?? Infinity : aa;
          \t\t\t\tconst bResidual = b.fit.fitKind === 'rail-projection' ? b.fit.badgePerpendicularErrorPx ?? Infinity : ba;
          \t\t\t\treturn b.fragmentPixels.length - a.fragmentPixels.length || aResidual - bResidual || a.supportingComponentIds[0]!.localeCompare(b.supportingComponentIds[0]!);
          \t\t\t}
          '''
          if s.count(old)!=1: raise SystemExit('candidate ranking anchor drifted')
          s=s.replace(old,new,1)

          # Cross-target acceptance + winner uses rail perpendicular residual where available.
          old='''\tconst accepted = candidates.filter((candidate) => {
          \t\tconst support = candidate.fragmentPixels.length;
          \t\treturn support >= MIN_SHARD_SUPPORT_PIXELS &&
          \t\t\tunexplainedPixels(candidate).length === 0 &&
          \t\t\t(badgeAxisError(candidate) ?? Infinity) < activeAxisLimitRad;
          \t});
          '''
          new='''\tconst accepted = candidates.filter((candidate) => {
          \t\tconst support = candidate.fragmentPixels.length;
          \t\tconst railMiss = candidate.fit.fitKind === 'rail-projection' ? candidate.fit.badgePerpendicularMissPx ?? Infinity : undefined;
          \t\treturn support >= MIN_SHARD_SUPPORT_PIXELS &&
          \t\t\tunexplainedPixels(candidate).length === 0 &&
          \t\t\t(railMiss !== undefined ? railMiss === 0 : (badgeAxisError(candidate) ?? Infinity) < activeAxisLimitRad);
          \t});
          '''
          if s.count(old)!=1: raise SystemExit('cross-target accepted anchor drifted')
          s=s.replace(old,new,1)
          old='''\t\tconst ranked = [...bucket].sort((a, b) => (badgeAxisError(a) ?? Infinity) - (badgeAxisError(b) ?? Infinity));
          '''
          new='''\t\tconst ranked = [...bucket].sort((a, b) => {
          \t\t\tconst ar = a.fit.fitKind === 'rail-projection' ? a.fit.badgePerpendicularErrorPx ?? Infinity : badgeAxisError(a) ?? Infinity;
          \t\t\tconst br = b.fit.fitKind === 'rail-projection' ? b.fit.badgePerpendicularErrorPx ?? Infinity : badgeAxisError(b) ?? Infinity;
          \t\t\treturn ar - br;
          \t\t});
          '''
          if s.count(old)!=1: raise SystemExit('cross-target rank anchor drifted')
          s=s.replace(old,new,1)

          # Render the actual pixel residual and the two projected lane rails.
          anchor='''\t\t\tconst shardPixels = candidate.fragmentPixels.map((point) => localPoint(candidate, point, {}));
          '''
          inject=anchor+'''\t\t\tif (candidate.fit.fitKind === 'rail-projection' && candidate.badgeId) {
          \t\t\t\tconst badge = badges.find((entry) => entry.detId === candidate.badgeId);
          \t\t\t\tif (badge) {
          \t\t\t\t\tconst fitY = candidate.fit.centerYPx + (candidate.coordinateFrame === 'original' ? 0 : candidate.viewportTopPx ?? 0);
          \t\t\t\t\tconst c = Math.cos(candidate.fit.angleRad), ss = Math.sin(candidate.fit.angleRad);
          \t\t\t\t\tconst nx = -ss, ny = c;
          \t\t\t\t\tconst dx = badge.cxPx - candidate.fit.centerXPx, dy = badge.cyPx - fitY;
          \t\t\t\t\tconst along = dx * c + dy * ss;
          \t\t\t\t\tconst foot: readonly [number, number] = [candidate.fit.centerXPx + along * c, fitY + along * ss];
          \t\t\t\t\tfor (const side of [-1, 1] as const) {
          \t\t\t\t\t\tconst ox = side * candidate.fit.halfHeightPx * nx, oy = side * candidate.fit.halfHeightPx * ny;
          \t\t\t\t\t\tctx.overlay('teeRecovery', { type: 'polyline', path: [[candidate.fit.centerXPx + ox, fitY + oy], [foot[0] + ox, foot[1] + oy]], verdict: 'info', visualRole: 'tee-badge-path', ref: `${result.id}:projected-rail-${side}`, reason: `projected known tee-width boundary; perpendicular badge miss ${(candidate.fit.badgePerpendicularMissPx ?? Infinity).toFixed(3)}px` });
          \t\t\t\t\t}
          \t\t\t\t\tctx.overlay('teeRecovery', { type: 'polyline', path: [foot, [badge.cxPx, badge.cyPx]], verdict: (candidate.fit.badgePerpendicularMissPx ?? Infinity) > 0 ? 'rejected' : 'info', visualRole: 'tee-badge-path', ref: `${result.id}:perpendicular-residual`, reason: `rail projection perpendicular centerline error ${(candidate.fit.badgePerpendicularErrorPx ?? Infinity).toFixed(3)}px; outside-lane miss ${(candidate.fit.badgePerpendicularMissPx ?? Infinity).toFixed(3)}px` });
          \t\t\t\t}
          \t\t\t}
          '''
          if s.count(anchor)!=1: raise SystemExit('overlay anchor drifted')
          s=s.replace(anchor,inject,1)

          p.write_text(s)
          PY

      - name: Build
        working-directory: ChainSpot
        run: |
          npm ci
          npm --workspace @chainspot/alg run build

      - name: Commit rail projection
        working-directory: ChainSpot
        run: |
          git config user.name 'ChainSpot G4 Experiment'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/alg/src/detectors/threeFactor/features/g3.teeRecovery.ts
          git commit -m '[g4-rail] Project known tee width from observed rails'
          echo "EXPERIMENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run exact baseline and rail experiment through G6
        working-directory: ChainSpot
        run: |
          set -euo pipefail
          run_one() {
            label="$1"; ref="$2"
            git checkout --force "$ref"
            ./lab setup >/tmp/${label}-setup.log 2>&1
            rm -rf artifacts/sweep
            ./lab sweep batch --through G6 packages/alg/src/detectors/threeFactor/configs/default.json dev > /tmp/${label}.log 2>&1
            cp artifacts/sweep/dev72-recovered-default/batches/summary.json /tmp/${label}-batch.json
            python - "$label" <<'PY'
          import json,sys
          from pathlib import Path
          label=sys.argv[1]
          out={}
          for p in Path('artifacts/sweep').rglob('run.receipt.json'):
              d=json.loads(p.read_text())
              src=json.dumps(d.get('intake',{}))
              course=next((x for x in ['AlexClark','DashsTrack','HeritagePark','Lenard','NorthPark','TowneLake'] if x in src),'UNKNOWN')
              unit=next((u for u in d.get('units',[]) if u.get('id')=='teeRecovery'),{})
              ms={m.get('name'):{k:m.get(k) for k in ['count','min','max','mean']} for m in unit.get('measurements',[])}
              out[course]={
                'results':d.get('results',{}),
                'assignments':{str(a.get('hole')):[a.get('teeId'),a.get('basketId'),a.get('score')] for a in d.get('assignments',[])},
                'recovery':ms,
                'order':[f"{o.get('gate')}:{o.get('id')}" for o in d.get('operations',[])]
              }
          Path(f'/tmp/{label}.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          PY
          }
          run_one base "$BASE_SHA"
          run_one rail "$EXPERIMENT_SHA"
          python - <<'PY'
